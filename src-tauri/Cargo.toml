[package]
name = "remotepal"
version = "0.1.0"
description = "RemotePal SSH manager"
authors = ["Ali khandi <alikhandi@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "remotepal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# ring backend: aws-lc-rs (the default) needs CMake+NASM to build on Windows
russh = { version = "0.63.0", default-features = false, features = ["ring", "flate2", "rsa"] }
tokio = { version = "1.53.1", features = ["sync", "rt", "macros", "time", "io-util"] }
base64 = "0.23.1"
dirs = "6.0.0"
uuid = { version = "1.24.1", features = ["v4"] }
keyring = "4.1.6"

