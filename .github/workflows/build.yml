name: Build

# Manual cross-platform build: Actions tab -> Build -> Run workflow.
# Produces unsigned installers for Windows, macOS, and Linux as
# downloadable workflow artifacts. Optionally fill in "release-tag"
# to also draft a GitHub release with the installers attached.

on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: "Draft a release under this tag (e.g. v0.1.0); leave empty for artifacts only"
        required: false
        default: ""

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build installers
        if: inputs.release-tag == ''
        uses: tauri-apps/tauri-action@v0

      - name: Build installers and draft release
        if: inputs.release-tag != ''
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.release-tag }}
          releaseName: "RemotePal ${{ inputs.release-tag }}"
          releaseDraft: true

      - uses: actions/upload-artifact@v7
        with:
          name: remotepal-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
